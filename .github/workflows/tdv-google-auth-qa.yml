name: TDV Google OIDC security gate QA
on:
  push:
    branches:
      - tdv-google-auth-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile auth and existing entry point
        run: python -m py_compile tdv_auth.py app.py tests/test_tdv_auth.py
      - name: Run all synthetic and security regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify same Streamlit app fails closed when Secrets absent
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          test = AppTest.from_file("app.py", default_timeout=30).run()
          assert not test.exception, str(list(test.exception))
          assert any("ĐÃ KHÓA" in x.message for x in test.error), [
              x.message for x in test.error
          ]
          assert not test.sidebar.radio, "Unauthenticated visitors must not see a business menu"
          print("TDV_GOOGLE_OIDC_FAIL_CLOSED_OK")
          PY
