name: TDV NSX source mapping + legal guard QA
on:
  push:
    branches:
      - tdv-nsx-field-mapping-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source mapping, read-only UI and tests
        run: python -m py_compile tdv_nsx_workbench.py tdv_leadership_report.py tdv_comparison_ui.py tests/test_tdv_nsx_field_mapping.py
      - name: Full synthetic fixture regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Boot the SAME Streamlit app
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          test = AppTest.from_file('app.py', default_timeout=30).run()
          assert not test.exception, str(list(test.exception))
          print('TDV_SAME_APP_SOURCE_MAPPING_OK')
          PY
