name: TDV NSX product registration + factory GMP review QA
on:
  push:
    branches:
      - tdv-nsx-evidence-links-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-evidence-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m py_compile tdv_nsx_evidence_candidates.py tdv_nsx_auto.py tdv_nsx_workbench.py tdv_leadership_report.py tests/test_tdv_nsx_evidence_candidates.py
      - name: Full synthetic regression, including safety and Excel traces
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Same Streamlit app startup smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py', default_timeout=30).run()
          assert not app.exception, str(list(app.exception))
          print("TDV_NSX_EVIDENCE_QA_EXISTING_APP_BOOT_OK")
          PY
