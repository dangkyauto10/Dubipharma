name: SEE PRO BOOX - build Android APK
on:
  push:
    branches: [ 'feature/see-pro-boox-reader-20261103' ]
    paths: [ 'boox-reader/**', '.github/workflows/see-pro-boox-apk.yml' ]
  pull_request:
    paths: [ 'boox-reader/**', '.github/workflows/see-pro-boox-apk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK (standalone, local OCR)
        working-directory: boox-reader
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SEE_PRO_READER_BOOX_APK
          path: boox-reader/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
