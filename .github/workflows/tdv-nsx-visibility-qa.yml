name: TDV NSX conflict visibility QA
on:
  push:
    branches: [tdv-nsx-visibility-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  business-ui-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compile business UI
        run: python -m py_compile tdv_nsx_workbench.py tdv_nsx_source_diff.py tests/test_tdv_nsx_visibility.py
      - name: All current business and UI unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Retain Google OIDC fail-closed gate
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py', default_timeout=30).run()
          assert not at.exception, str(list(at.exception))
          assert not at.sidebar.radio
          print("TDV_NSX_VISIBILITY_AUTH_FAIL_CLOSED_OK")
          PY
