name: TDV Streamlit External Health Diagnostics
on:
  push:
    branches: [tdv-see-pro-nsx-public-corpus-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Streamlit login flow with persistent cookies (no secret logging)
        shell: bash
        run: |
          python -m pip install -q requests
          python - <<'PY'
          import requests
          from urllib.parse import urljoin, urlparse
          base="https://dangkyauto10-dubipharma-app-tdv-qc7-online-preview-20261-k4zpor.streamlit.app"
          for suffix in ("/", "/_stcore/health"):
              session=requests.Session()
              url=base+suffix
              print(f"--- {suffix} ---")
              for attempt in range(12):
                  try:
                      resp=session.get(url, timeout=10, allow_redirects=False)
                  except requests.RequestException as exc:
                      print("request_error",type(exc).__name__);break
                  u=urlparse(resp.url)
                  print(f"hop={attempt+1} code={resp.status_code} host={u.netloc} path={u.path} content_type={resp.headers.get('content-type','')}")
                  if resp.is_redirect:
                      next_url=urljoin(resp.url,resp.headers['location'])
                      url=next_url
                  else:
                      print("end_code",resp.status_code)
                      break
              else:
                  print("REDIRECTS_EXCEEDED_WITH_COOKIES")
          print("DIAGNOSTIC ONLY - no Streamlit administrator tokens or user data")
          PY
