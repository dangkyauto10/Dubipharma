name: TDV Streamlit Browser Startup Diagnostics
on:
  push:
    branches: [tdv-see-pro-nsx-public-corpus-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic Chromium only in isolated runner
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Test visible Streamlit app after page load
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright
          HOSTS=[
              "https://dangkyauto10-dubipharma-app-tdv-qc7-online-preview-20261-k4zpor.streamlit.app",
              "https://mcperlin.streamlit.app",
          ]
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  for url in HOSTS:
                      page=await browser.new_page()
                      problems=[]
                      websocket_events=[]
                      page.on("pageerror",lambda error:problems.append("js:"+str(error)[:110]))
                      page.on("requestfailed",lambda req:problems.append("net:"+urlparse(req.url).path[:90]))
                      page.on("websocket",lambda ws:websocket_events.append("ws_created:"+urlparse(ws.url).path))
                      try:
                          r=await page.goto(url,timeout=35000,wait_until="domcontentloaded")
                          await page.wait_for_timeout(22000)
                          text=(await page.locator("body").inner_text())[:450].replace("\n"," | ")
                          main_count=await page.locator('[data-testid="stAppViewContainer"]').count()
                          print("APP",urlparse(url).netloc,
                                "HTTP",r.status if r else "-",
                                "FINAL_HOST",urlparse(page.url).netloc,
                                "MAIN_CONTAINER",main_count,
                                "BODY",repr(text),
                                "WS",websocket_events[:8],
                                "ISSUES",problems[:12])
                      except Exception as exc:
                          print("APP",urlparse(url).netloc,
                                "BROWSER_ERROR",type(exc).__name__,
                                str(exc).splitlines()[0][:150],
                                "ISSUES",problems[:6])
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          PY
