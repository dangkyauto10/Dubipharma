name: TDV SEE PRO · isolated E-HSMT XLSX QA
on:
  push:
    branches:
      - tdv-see-pro-real-ehsmt-xlsx-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check, read-only
        run: python -m py_compile tdv_ehsmt_xlsx.py tests/test_tdv_ehsmt_xlsx.py
      - name: Full regression, no Drive writes and no deployment
        run: python -m unittest discover -s tests -p 'test_*.py' -v
