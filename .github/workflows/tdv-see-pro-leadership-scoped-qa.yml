name: SEE PRO scoped leadership QA
on:
  push:
    branches:
      - tdv-see-pro-leadership-scoped-qa-20261023
      - tdv-qc7-online-preview-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing app dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all changed modules
        run: python -m py_compile app.py see_pro_workbench.py tdv_nsx_workbench.py tdv_comparison_ui.py tdv_see_pro_scope.py tdv_see_pro_leadership.py tests/test_tdv_see_pro_leadership_scope.py
      - name: Verify all prior tests plus new scope gate
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fail-closed login smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          test=AppTest.from_file('app.py',default_timeout=30).run()
          assert not test.exception, str(list(test.exception))
          print('SEE_PRO_SCOPED_LOGIN_FAIL_CLOSED_OK')
          PY
