name: TDV leadership source review priority QA
on:
  push:
    branches:
      - tdv-leadership-triage-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all impacted modules
        run: python -m py_compile tdv_review_priorities.py tdv_comparison_ui.py tdv_leadership_report.py tests/test_tdv_leadership_triage.py
      - name: All synthetic regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Existing Streamlit app UI startup smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          test=AppTest.from_file('app.py', default_timeout=30).run()
          assert not test.exception, str(list(test.exception))
          print('TDV_LEADERSHIP_TRIAGE_SAME_APP_OK')
          PY
