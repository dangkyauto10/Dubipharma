name: TDV QC7 Online · Read-only IDP3 checks
on:
  push:
    branches:
      - tdv-qc7-online-preview-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax checks
        run: python -m py_compile app.py tdv_demo_core.py tdv_idp3_rules.py tdv_idp3_workflow.py tests/test_tdv_demo_core.py tests/test_tdv_idp3_rules.py tests/test_tdv_idp3_workflow.py
      - name: Read-only regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
