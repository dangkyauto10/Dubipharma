name: TDV QC7 Online · Read-only IDP3 checks
on:
  push:
    branches:
      - tdv-qc7-online-preview-20261020
      - tdv-see-pro-repair-20261020
      - tdv-see-pro-accuracy-20261020
      - tdv-see-pro-evidence-ai-20261020
      - tdv-see-pro-traceable-review-20261020
      - tdv-see-pro-notice-classifier-20261020
      - tdv-nsx-real-intake-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax checks
        run: python -m py_compile app.py tdv_demo_core.py tdv_idp3_rules.py tdv_idp3_workflow.py tdv_nsx_intake.py tdv_nsx_workbench.py tdv_ehsmt_intake.py tdv_real_intake.py see_pro_core.py see_pro_multiformat.py see_pro_structured.py see_pro_notice.py see_pro_adapters.py see_pro_pdf_geometry.py see_pro_ai_review.py see_pro_traceability.py see_pro_pdf_viewer.py see_pro_workbench.py see_pro_streamlit.py tests/test_tdv_demo_core.py tests/test_tdv_idp3_rules.py tests/test_tdv_idp3_workflow.py tests/test_tdv_nsx_intake.py tests/test_tdv_ehsmt_intake.py tests/test_see_pro_multiformat.py tests/test_see_pro_structured.py tests/test_see_pro_notice.py tests/test_see_pro_adapters.py tests/test_see_pro_pdf_geometry.py tests/test_see_pro_ai_review.py tests/test_see_pro_traceability.py
      - name: Read-only regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
