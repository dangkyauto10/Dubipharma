name: TDV single-app real E-HSMT / NSX / Comparison QA
on:
  push:
    branches:
      - tdv-real-comparison-integration-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Compile new online modules without deployment
        run: python -m py_compile app.py tdv_ehsmt_xlsx.py see_pro_workbench.py tdv_nsx_auto.py tdv_nsx_workbench.py tdv_tender_context.py tdv_tender_trace.py tdv_leadership_report.py tdv_comparison_ui.py
      - name: Full synthetic-unit regression, no Drive writes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Streamlit runtime and comparison page startup
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          a=AppTest.from_file("app.py",default_timeout=35).run()
          assert not a.exception, str(list(a.exception))
          print("TDV_COMPARE_APP_STARTS")
          PY
      - name: Render colored side-by-side evidence with native Streamlit
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          source = """
          from tdv_comparison_ui import _criteria
          _criteria({"criteria":[
             {"field":"HOAT_CHAT","label":"Hoạt chất","ehsmt":"Ingredient A",
              "nsx":"Ingredient A","status":"DAT_SO_BO",
              "ehsmt_evidence":{"file":"ehsmt.xlsx","location":"Sheet 1"},
              "nsx_evidence":{"file":"nsx.docx","location":"Paragraph 1"},
              "note":"Trích xuất sơ bộ"},
             {"field":"ROUTE","label":"Đường dùng","ehsmt":"Uống",
              "nsx":"Tiêm","status":"KHONG_KHOP_CAN_XAC_MINH",
              "ehsmt_evidence":{"file":"ehsmt.xlsx","location":"Sheet 2"},
              "nsx_evidence":{"file":"nsx.docx","location":"Paragraph 2"},
              "note":"Không khớp sơ bộ"}]})
          """
          test=AppTest.from_string(source,default_timeout=30).run()
          assert not test.exception, str(list(test.exception))
          print("TDV_COLORED_TWO_SOURCE_VIEW_PASS")
          PY
