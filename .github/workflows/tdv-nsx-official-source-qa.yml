name: TDV NSX · isolated official-public-reference QA
on:
  push:
    branches:
      - tdv-nsx-real-official-gmp-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile tdv_nsx_public_guard.py tests/test_tdv_nsx_public_guard.py
      - name: Full read-only regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
